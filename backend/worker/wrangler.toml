name = "shooting-master-api"
main = "index.ts"
compatibility_date = "2026-11-01"

# Legacy Worker is retained only as a disabled rollback artifact.
# The active API, AdsGram callback, Telegram webhook and payout queue run on Render.
workers_dev = false

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1.0

[vars]
APP_ORIGIN = "https://shooting-master.pages.dev"
PAYOUT_ENABLED = "false"

# Explicitly remove the legacy scheduled payout recovery trigger.
[triggers]
crons = []
