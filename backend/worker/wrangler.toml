name = "shooting-master-api"
main = "index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1.0

[vars]
APP_ORIGIN = "https://shooting-master.pages.dev"
PAYOUT_ENABLED = "false"

[[queues.producers]]
binding = "PAYOUT_QUEUE"
queue = "shooting-master-payouts"

[[queues.consumers]]
queue = "shooting-master-payouts"
max_batch_size = 1
max_concurrency = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "shooting-master-payouts-dlq"

[triggers]
crons = ["*/5 * * * *"]
