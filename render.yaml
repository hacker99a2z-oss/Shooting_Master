services:
  - type: web
    name: shooting-master-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ORIGIN
        value: https://shooting-master.pages.dev
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADSGRAM_REWARD_SECRET
        sync: false
      - key: OFFICIAL_CHANNEL_URL
        value: https://t.me/shooting_master
      - key: OFFICIAL_GROUP_URL
        value: https://t.me/shooting_master_group
      - key: PAYOUT_ENABLED
        value: "false"
      - key: PAYOUT_PRIVATE_KEY
        sync: false
      - key: BSC_RPC_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_ENABLED
        value: "true"
