name: Deploy Shooting Master
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shooting-master-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment secrets
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN TELEGRAM_BOT_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
      - name: Install backend tools
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Ensure payout queues exist
        working-directory: backend
        shell: bash
        run: |
          QUEUES="$(npx wrangler queues list --config worker/wrangler.toml)"
          if ! printf '%s' "$QUEUES" | grep -Fq 'shooting-master-payouts-dlq'; then
            npx wrangler queues create shooting-master-payouts-dlq --config worker/wrangler.toml
          fi
          if ! printf '%s' "$QUEUES" | grep -Fq 'shooting-master-payouts'; then
            npx wrangler queues create shooting-master-payouts --config worker/wrangler.toml
          fi
      - name: Apply Turso schema
        working-directory: backend
        run: npm run db:migrate
      - name: Read-only payout queue audit
        working-directory: backend
        run: node scripts/report-payout-state.mjs
      - name: Deploy API Worker
        id: worker
        working-directory: backend
        shell: bash
        env:
          OFFICIAL_CHANNEL_URL: ${{ vars.OFFICIAL_CHANNEL_URL }}
          OFFICIAL_GROUP_URL: ${{ vars.OFFICIAL_GROUP_URL }}
          PAYOUT_ENABLED: ${{ vars.PAYOUT_ENABLED }}
          PAYOUT_PRIVATE_KEY: ${{ secrets.PAYOUT_PRIVATE_KEY }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
        run: |
          set -o pipefail
          # Use the configured repository variables when present; otherwise use the official links supplied for this bot.
          OFFICIAL_CHANNEL_URL="${OFFICIAL_CHANNEL_URL:-https://t.me/shooting_master}"
          OFFICIAL_GROUP_URL="${OFFICIAL_GROUP_URL:-https://t.me/shooting_master_group}"
          WRANGLER_VARS=(
            --var "OFFICIAL_CHANNEL_URL:${OFFICIAL_CHANNEL_URL}"
            --var "OFFICIAL_GROUP_URL:${OFFICIAL_GROUP_URL}"
          )
          if [[ "${PAYOUT_ENABLED,,}" == "true" ]]; then
            if [ -z "${PAYOUT_PRIVATE_KEY}" ] || [ -z "${BSC_RPC_URL}" ]; then
              echo "::error::Automatic payouts requested, but PAYOUT_PRIVATE_KEY or BSC_RPC_URL is missing from GitHub Actions secrets."
              exit 1
            fi
            WRANGLER_VARS+=(--var "PAYOUT_ENABLED:true")
            echo "Automatic USDT payouts are enabled; signing key and RPC endpoint are supplied as secrets."
          else
            WRANGLER_VARS+=(--var "PAYOUT_ENABLED:false")
            echo "Automatic payouts remain disabled; withdrawals will be routed to manual review."
          fi
          npx wrangler deploy --config worker/wrangler.toml "${WRANGLER_VARS[@]}" 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://shooting-master-api\.[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -1)"
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Could not read the Worker URL from Wrangler output."
            exit 1
          fi
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Set Worker secrets
        working-directory: backend
        shell: bash
        env:
          PAYOUT_ENABLED: ${{ vars.PAYOUT_ENABLED }}
          PAYOUT_PRIVATE_KEY: ${{ secrets.PAYOUT_PRIVATE_KEY }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          ADSGRAM_REWARD_SECRET: ${{ secrets.ADSGRAM_REWARD_SECRET }}
        run: |
          printf '%s' "$TURSO_DATABASE_URL" | npx wrangler secret put TURSO_DATABASE_URL --config worker/wrangler.toml
          printf '%s' "$TURSO_AUTH_TOKEN" | npx wrangler secret put TURSO_AUTH_TOKEN --config worker/wrangler.toml
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config worker/wrangler.toml
          if [ -n "${ADSGRAM_REWARD_SECRET:-}" ]; then
            printf '%s' "$ADSGRAM_REWARD_SECRET" | npx wrangler secret put ADSGRAM_REWARD_SECRET --config worker/wrangler.toml
            echo "AdsGram server-side reward callback secret uploaded."
          fi
          if [[ "${PAYOUT_ENABLED,,}" == "true" ]]; then
            printf '%s' "$PAYOUT_PRIVATE_KEY" | npx wrangler secret put PAYOUT_PRIVATE_KEY --config worker/wrangler.toml
            printf '%s' "$BSC_RPC_URL" | npx wrangler secret put BSC_RPC_URL --config worker/wrangler.toml
          fi
      - name: Resolve Telegram bot username
        id: telegram
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          if (!token) throw new Error("Missing Telegram bot token");
          const response = await fetch(`https://api.telegram.org/bot${token}/getMe`);
          const result = await response.json();
          if (!response.ok || !result.ok || !result.result?.username) {
            console.error("Could not read the Telegram bot username:", result.description || response.status);
            process.exit(1);
          }
          const { appendFileSync } = await import("node:fs");
          appendFileSync(process.env.GITHUB_OUTPUT, `username=${result.result.username}\\n`);
          console.log("Telegram bot username resolved; webhook is managed by Render.");
          NODE
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate AdsGram Block ID
        env:
          VITE_ADSGRAM_BLOCK_ID: ${{ vars.VITE_ADSGRAM_BLOCK_ID }}
        shell: bash
        run: |
          if [ -z "${VITE_ADSGRAM_BLOCK_ID//[[:space:]]/}" ]; then
            echo "::error::Missing GitHub Actions repository variable VITE_ADSGRAM_BLOCK_ID. Add it under Settings → Secrets and variables → Actions → Variables, then rerun deployment."
            exit 1
          fi
          echo "AdsGram Block ID is configured."
      - name: Build Pages frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://shooting-master-api-5ao3.onrender.com
          VITE_TELEGRAM_BOT_USERNAME: ${{ steps.telegram.outputs.username }}
          VITE_ADSGRAM_BLOCK_ID: ${{ vars.VITE_ADSGRAM_BLOCK_ID }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_PROOF_URL: ${{ vars.VITE_PROOF_URL }}
        run: npm run build
      - name: Ensure Pages project exists
        working-directory: backend
        shell: bash
        run: |
          PROJECTS="$(npx wrangler pages project list)"
          if ! printf '%s' "$PROJECTS" | grep -Fq 'shooting-master'; then
            npx wrangler pages project create shooting-master --production-branch main
          fi
      - name: Deploy Pages
        working-directory: backend
        run: npx wrangler pages deploy ../frontend/dist --project-name shooting-master --branch main --commit-hash "$GITHUB_SHA" --commit-message "Deploy $GITHUB_SHA"
      - name: Smoke-test Render API before/after Pages deployment
        env:
          RENDER_API_URL: https://shooting-master-api-5ao3.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors --max-time 30 "$RENDER_API_URL/health")"
          printf '%s' "$BODY" | grep -Fq '"ok":true'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 -D - -o /dev/null -H "Origin: https://shooting-master.pages.dev" "$RENDER_API_URL/health" | grep -Fqi 'access-control-allow-origin: https://shooting-master.pages.dev'
      - name: Smoke-test Pages homepage
        run: curl --fail --silent --show-error --retry 8 --retry-delay 3 https://shooting-master.pages.dev/ -o /dev/null
