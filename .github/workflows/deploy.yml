name: Deploy Shooting Master
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shooting-master-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment secrets
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN TELEGRAM_BOT_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
      - name: Install backend tools
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Apply Turso schema
        working-directory: backend
        run: npm run db:migrate
      - name: Read-only payout queue audit
        working-directory: backend
        run: node scripts/report-payout-state.mjs
      - name: Disable legacy Cloudflare API Worker
        working-directory: backend
        run: npx wrangler deploy --config worker/wrangler.toml
      - name: Resolve Telegram bot username
        id: telegram
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          if (!token) throw new Error("Missing Telegram bot token");
          const response = await fetch(`https://api.telegram.org/bot${token}/getMe`);
          const result = await response.json();
          if (!response.ok || !result.ok || !result.result?.username) {
            console.error("Could not read the Telegram bot username:", result.description || response.status);
            process.exit(1);
          }
          const { appendFileSync } = await import("node:fs");
          appendFileSync(process.env.GITHUB_OUTPUT, `username=${result.result.username}\\n`);
          console.log("Telegram bot username resolved; webhook is managed by Render.");
          NODE
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate AdsGram Block ID
        env:
          VITE_ADSGRAM_BLOCK_ID: ${{ vars.VITE_ADSGRAM_BLOCK_ID }}
        shell: bash
        run: |
          if [ -z "${VITE_ADSGRAM_BLOCK_ID//[[:space:]]/}" ]; then
            echo "::error::Missing GitHub Actions repository variable VITE_ADSGRAM_BLOCK_ID. Add it under Settings → Secrets and variables → Actions → Variables, then rerun deployment."
            exit 1
          fi
          echo "AdsGram Block ID is configured."
      - name: Build Pages frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://shooting-master-api-5ao3.onrender.com
          VITE_TELEGRAM_BOT_USERNAME: ${{ steps.telegram.outputs.username }}
          VITE_ADSGRAM_BLOCK_ID: ${{ vars.VITE_ADSGRAM_BLOCK_ID }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_PROOF_URL: ${{ vars.VITE_PROOF_URL }}
        run: npm run build
      - name: Ensure Pages project exists
        working-directory: backend
        shell: bash
        run: |
          PROJECTS="$(npx wrangler pages project list)"
          if ! printf '%s' "$PROJECTS" | grep -Fq 'shooting-master'; then
            npx wrangler pages project create shooting-master --production-branch main
          fi
      - name: Deploy Pages
        working-directory: backend
        run: npx wrangler pages deploy ../frontend/dist --project-name shooting-master --branch main --commit-hash "$GITHUB_SHA" --commit-message "Deploy $GITHUB_SHA"
      - name: Smoke-test Render API before/after Pages deployment
        env:
          RENDER_API_URL: https://shooting-master-api-5ao3.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors --max-time 30 "$RENDER_API_URL/health")"
          printf '%s' "$BODY" | grep -Fq '"ok":true'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 -D - -o /dev/null -H "Origin: https://shooting-master.pages.dev" "$RENDER_API_URL/health" | grep -Fqi 'access-control-allow-origin: https://shooting-master.pages.dev'
      - name: Smoke-test Pages homepage
        run: curl --fail --silent --show-error --retry 8 --retry-delay 3 https://shooting-master.pages.dev/ -o /dev/null
      - name: Sync optional payout credentials to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PAYOUT_PRIVATE_KEY: ${{ secrets.PAYOUT_PRIVATE_KEY }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          RENDER_SERVICE_ID: srv-dbmlcqlg1s2s73b80mo0
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { RENDER_API_KEY, PAYOUT_PRIVATE_KEY, BSC_RPC_URL, RENDER_SERVICE_ID } = process.env;
          const missing = ["RENDER_API_KEY", "PAYOUT_PRIVATE_KEY", "BSC_RPC_URL"].filter((key) => !process.env[key]);
          if (missing.length) {
            console.warn("[render-env] Skipped payout credential sync; missing GitHub Actions secrets:", missing.join(", "));
            process.exit(0);
          }
          const base = `https://api.render.com/v1/services/${RENDER_SERVICE_ID}`;
          const headers = {
            accept: "application/json",
            "content-type": "application/json",
            authorization: `Bearer ${RENDER_API_KEY}`,
          };
          const list = await fetch(`${base}/env-vars?limit=100`, { headers });
          if (!list.ok) throw new Error(`Render environment lookup failed (HTTP ${list.status})`);
          const rows = await list.json();
          const values = new Map(rows.map((row) => [row.envVar?.key, row.envVar?.value]));
          const desired = { PAYOUT_PRIVATE_KEY, BSC_RPC_URL };
          let changed = false;
          for (const [key, value] of Object.entries(desired)) {
            if (values.get(key) === value) continue;
            const response = await fetch(`${base}/env-vars/${encodeURIComponent(key)}`, {
              method: "PUT",
              headers,
              body: JSON.stringify({ value }),
            });
            if (!response.ok) throw new Error(`Render could not update ${key} (HTTP ${response.status})`);
            changed = true;
            console.log(`[render-env] Updated ${key} on the Shooting Master API service.`);
          }
          if (changed) {
            const deploy = await fetch(`${base}/deploys`, {
              method: "POST",
              headers,
              body: JSON.stringify({ clearCache: "do_not_clear" }),
            });
            if (!deploy.ok) throw new Error(`Render deploy after secret sync failed (HTTP ${deploy.status})`);
            console.log("[render-env] Credential sync complete; Render deploy queued. PAYOUT_ENABLED was not changed.");
          } else {
            console.log("[render-env] Render already has the current payout credentials. No additional deploy needed.");
          }
          NODE
